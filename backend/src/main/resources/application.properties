
spring.application.name=ledgerline

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledgerline?options=-c%20timezone=UTC}
spring.datasource.username=${DB_USERNAME:ledgerline}
spring.datasource.password=${DB_PASSWORD:ledgerline_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Server
server.port=8080

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

ledgerline.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
ledgerline.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
